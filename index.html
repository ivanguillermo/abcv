<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Tasa BCV</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BCV Dólar">
  <link rel="apple-touch-icon" href="mitasa.png">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --input-bg: #0f172a;
      --success-color: #4ade80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .badge {
      font-size: 0.75rem;
      color: var(--accent-color);
      background-color: rgba(56, 189, 248, 0.1);
      padding: 4px 8px;
      border-radius: 12px;
      margin-top: 4px;
    }

    /* Pestañas de Navegación */
    .tab-container {
      display: flex;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #0f172a;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .rate-box {
      text-align: center;
      margin-bottom: 20px;
    }

    .rate-box .label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .rate-box .value {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--accent-color);
      margin: 4px 0;
    }

    .rate-box .date-applied {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 18px;
    }

    .field-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .field-header label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .live-preview {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--success-color);
      background-color: rgba(74, 222, 128, 0.1);
      padding: 2px 8px;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .live-preview.visible {
      opacity: 1;
    }

    input[type="number"], input[type="date"] {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 1.15rem;
      outline: none;
    }

    input[type="date"] {
      font-size: 1rem;
      color-scheme: dark;
    }

    input[type="number"]:focus, input[type="date"]:focus {
      border-color: var(--accent-color);
    }

    .refresh-btn {
      width: 100%;
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-bottom: 10px;
    }

    .floating-tools {
      display: flex;
      gap: 8px;
    }

    .tool-btn {
      flex: 1;
      background-color: #334155;
      color: #f8fafc;
      border: none;
      padding: 10px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .tool-btn:active {
      opacity: 0.8;
    }

    .status {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .history-selector {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Calculadora Dólar BCV</h1>
      <span id="statusBadge" class="badge">Conectando...</span>
    </header>

    <!-- Control de Pestañas -->
    <div class="tab-container">
      <button type="button" class="tab-btn active" id="tabHoyBtn">Tasa de Hoy</button>
      <button type="button" class="tab-btn" id="tabHistorialBtn">Consultar Histórico</button>
    </div>

    <main class="card">
      <!-- Selector de Fecha para modo Histórico -->
      <div class="field-group history-selector" id="historyDateGroup" style="display: none;">
        <div class="field-header">
          <label for="historyDateInput">Seleccionar Fecha Pasada</label>
        </div>
        <input type="date" id="historyDateInput">
      </div>

      <div class="rate-box">
        <div class="label" id="rateLabel">Tasa de Hoy</div>
        <div class="value" id="rateDisplay">--.--</div>
        <div class="date-applied" id="dateAppliedDisplay">Obteniendo valor...</div>
      </div>

      <!-- Conversión USD -> VES -->
      <div class="field-group">
        <div class="field-header">
          <label for="usdInput">Dólares ($ USD)</label>
          <span id="usdLivePreview" class="live-preview"></span>
        </div>
        <input type="number" id="usdInput" placeholder="0.00" step="any" inputmode="decimal">
      </div>

      <!-- Conversión VES -> USD -->
      <div class="field-group">
        <div class="field-header">
          <label for="vesInput">Bolívares (Bs. VES)</label>
          <span id="vesLivePreview" class="live-preview"></span>
        </div>
        <input type="number" id="vesInput" placeholder="0.00" step="any" inputmode="decimal">
      </div>

      <button type="button" id="btnRefresh" class="refresh-btn">🔄 Actualizar Tasa</button>
      
      <!-- Botones para activar los modos flotantes / notificaciones -->
      <div class="floating-tools">
        <button type="button" id="btnPip" class="tool-btn">🪟 Ventana Flotante</button>
        <button type="button" id="btnNotif" class="tool-btn">🎵 Modo Notificación</button>
      </div>
    </main>

    <div class="status" id="footerStatus">Conectado a Google Sheets</div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwS6hBrm4JOX6eQkTAMhlw6tEYIoJE5eIS6bsLOOexNjJ0gIGOXSWixoD-0WOlTmm8R/exec";

    let currentActiveRate = 0;
    let todayRate = 0;
    let todayDateStr = "";
    let historicoData = [];
    let currentMode = "today"; // "today" o "history"

    const usdInput = document.getElementById('usdInput');
    const vesInput = document.getElementById('vesInput');
    const usdLivePreview = document.getElementById('usdLivePreview');
    const vesLivePreview = document.getElementById('vesLivePreview');
    const rateDisplay = document.getElementById('rateDisplay');
    const rateLabel = document.getElementById('rateLabel');
    const dateAppliedDisplay = document.getElementById('dateAppliedDisplay');
    const statusBadge = document.getElementById('statusBadge');
    const btnRefresh = document.getElementById('btnRefresh');
    const btnPip = document.getElementById('btnPip');
    const btnNotif = document.getElementById('btnNotif');

    const tabHoyBtn = document.getElementById('tabHoyBtn');
    const tabHistorialBtn = document.getElementById('tabHistorialBtn');
    const historyDateGroup = document.getElementById('historyDateGroup');
    const historyDateInput = document.getElementById('historyDateInput');

    // Audio silencioso para mantener activa la notificación multimedia
    const audioSilencioso = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=');
    audioSilencioso.loop = true;

    document.addEventListener('DOMContentLoaded', () => {
      const cachedRate = localStorage.getItem('bcv_rate_d1');
      if (cachedRate) {
        currentActiveRate = parseFloat(cachedRate);
        rateDisplay.textContent = `${currentActiveRate.toFixed(2)} Bs.`;
        statusBadge.textContent = "Caché Local";
      }

      obtenerTasaD1();
      cargarHistoricoAsincrono();
    });

    async function obtenerTasaD1() {
      statusBadge.textContent = "Conectando...";
      try {
        const response = await fetch(`${API_URL}?action=tasa`);
        const data = await response.json();

        if (data && data.tasa) {
          let rawValue = data.tasa.toString().replace(',', '.');
          currentActiveRate = parseFloat(rawValue);

          if (!isNaN(currentActiveRate)) {
            rateDisplay.textContent = `${currentActiveRate.toFixed(2)} Bs.`;
            dateAppliedDisplay.textContent = `Actualizado: ${data.fecha ? data.fecha.substring(0, 10) : 'Hoy'}`;
            statusBadge.textContent = "Conectado";
            localStorage.setItem('bcv_rate_d1', currentActiveRate);
            
            recalcularLive('usd');
          } else {
            rateDisplay.textContent = "Error";
            dateAppliedDisplay.textContent = "El valor en D1 no es un número válido";
          }
        }
      } catch (error) {
        console.error("Error obteniendo D1:", error);
        statusBadge.textContent = "Sin conexión";
        if (currentActiveRate > 0) {
          dateAppliedDisplay.textContent = "Usando última tasa guardada";
        }
      }
    }

    async function cargarHistoricoAsincrono() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        if (data && data.datos) {
          localStorage.setItem('bcv_historico', JSON.stringify(data.datos));
        }
      } catch (error) {
        console.error("Error cargando el histórico:", error);
      }
    }

    function mostrarTasaHoy() {
      currentActiveRate = todayRate > 0 ? todayRate : currentActiveRate;
      rateLabel.textContent = "Tasa Celda D1 (Hoy)";
      if (currentActiveRate > 0) {
        rateDisplay.textContent = `${currentActiveRate.toFixed(2)} Bs.`;
      }
      recalcularLive('usd');
    }

    function buscarTasaPorFecha() {
      const fechaSeleccionada = historyDateInput.value;
      if (!fechaSeleccionada) return;

      const historicoGuardado = JSON.parse(localStorage.getItem('bcv_historico') || '[]');
      const registroEncontrado = historicoGuardado.find(item => {
        if (!item.fecha) return false;
        return item.fecha.substring(0, 10) === fechaSeleccionada;
      });

      if (registroEncontrado) {
        currentActiveRate = parseFloat(registroEncontrado.tasa);
        rateLabel.textContent = `Tasa del ${fechaSeleccionada}`;
        rateDisplay.textContent = `${currentActiveRate.toFixed(2)} Bs.`;
        dateAppliedDisplay.textContent = `Registro encontrado en histórico`;
      } else {
        currentActiveRate = 0;
        rateLabel.textContent = `Sin registro`;
        rateDisplay.textContent = "--.--";
        dateAppliedDisplay.textContent = `No hay tasa guardada para el ${fechaSeleccionada}`;
      }
      
      recalcularLive('usd');
    }

    tabHoyBtn.addEventListener('click', () => {
      currentMode = "today";
      tabHoyBtn.classList.add('active');
      tabHistorialBtn.classList.remove('active');
      historyDateGroup.style.display = "none";
      mostrarTasaHoy();
    });

    tabHistorialBtn.addEventListener('click', () => {
      currentMode = "history";
      tabHistorialBtn.classList.add('active');
      tabHoyBtn.classList.remove('active');
      historyDateGroup.style.display = "flex";

      if (!historyDateInput.value) {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        historyDateInput.value = `${year}-${month}-${day}`;
      }
      buscarTasaPorFecha();
    });

    historyDateInput.addEventListener('change', buscarTasaPorFecha);

    function recalcularLive(origen) {
      if (currentActiveRate <= 0) {
        usdLivePreview.classList.remove('visible');
        vesLivePreview.classList.remove('visible');
        return;
      }

      if (origen === 'usd') {
        const valUSD = parseFloat(usdInput.value);
        if (!isNaN(valUSD) && valUSD > 0) {
          const resultadoBs = valUSD * currentActiveRate;
          vesInput.value = resultadoBs.toFixed(2);
          
          usdLivePreview.textContent = `= ${resultadoBs.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} Bs.`;
          usdLivePreview.classList.add('visible');
          vesLivePreview.classList.remove('visible');
        } else {
          vesInput.value = '';
          usdLivePreview.classList.remove('visible');
        }
      } else if (origen === 'ves') {
        const valVES = parseFloat(vesInput.value);
        if (!isNaN(valVES) && valVES > 0) {
          const resultadoUSD = valVES / currentActiveRate;
          usdInput.value = resultadoUSD.toFixed(2);
          
          vesLivePreview.textContent = `= $${resultadoUSD.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
          vesLivePreview.classList.add('visible');
          usdLivePreview.classList.remove('visible');
        } else {
          usdInput.value = '';
          vesLivePreview.classList.remove('visible');
        }
      }
    }

    usdInput.addEventListener('input', () => recalcularLive('usd'));
    vesInput.addEventListener('input', () => recalcularLive('ves'));
    btnRefresh.addEventListener('click', obtenerTasaD1);

    // ==========================================
    // 1. VENTANA FLOTANTE (Document PiP API)
    // ==========================================
    btnPip.addEventListener('click', async () => {
      if ('documentPictureInPicture' in window) {
        if (currentActiveRate <= 0) {
          alert('Espera a que cargue la tasa antes de abrir la calculadora flotante.');
          return;
        }

        const pipWindow = await documentPictureInPicture.requestWindow({
          width: 280,
          height: 230,
        });

        const style = pipWindow.document.createElement('style');
        style.textContent = `
          body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #1e293b;
            color: #f8fafc;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            user-select: none;
          }
          .box {
            background: #0f172a;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #334155;
          }
          .txt-usd { font-size: 13px; color: #94a3b8; margin: 0; }
          .txt-bs { font-size: 20px; font-weight: bold; color: #4ade80; margin: 4px 0 0 0; }
          input[type=range] { width: 100%; margin: 8px 0; accent-color: #38bdf8; cursor: pointer; }
          .btn-group { display: flex; gap: 4px; justify-content: space-between; }
          .btn-step {
            flex: 1;
            padding: 6px 0;
            background: #334155;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
          }
          .btn-step:active { background: #475569; }
        `;
        pipWindow.document.head.appendChild(style);

        pipWindow.document.body.innerHTML = `
          <div class="box">
            <p class="txt-usd">USD: <span id="pipUsd">10.00</span> $</p>
            <p class="txt-bs"><span id="pipBs">${(10 * currentActiveRate).toFixed(2)}</span> Bs.</p>
          </div>
          <input type="range" id="pipSlider" min="0" max="100" step="0.5" value="10">
          <div class="btn-group">
            <button class="btn-step" id="btnAdd05">+0.5</button>
            <button class="btn-step" id="btnAdd1">+1</button>
            <button class="btn-step" id="btnAdd5">+5</button>
            <button class="btn-step" id="btnAdd10">+10</button>
            <button class="btn-step" id="btnReset" style="background:#7f1d1d;">C</button>
          </div>
        `;

        let montoUSD = 10.00;
        const txtUsd = pipWindow.document.getElementById('pipUsd');
        const txtBs = pipWindow.document.getElementById('pipBs');
        const slider = pipWindow.document.getElementById('pipSlider');

        function actualizarPip(val) {
          montoUSD = Math.max(0, parseFloat(val) || 0);
          slider.value = montoUSD;
          txtUsd.innerText = montoUSD.toFixed(2);
          txtBs.innerText = (montoUSD * currentActiveRate).toFixed(2);
        }

        slider.addEventListener('input', (e) => actualizarPip(e.target.value));
        pipWindow.document.getElementById('btnAdd05').addEventListener('click', () => actualizarPip(montoUSD + 0.5));
        pipWindow.document.getElementById('btnAdd1').addEventListener('click', () => actualizarPip(montoUSD + 1));
        pipWindow.document.getElementById('btnAdd5').addEventListener('click', () => actualizarPip(montoUSD + 5));
        pipWindow.document.getElementById('btnAdd10').addEventListener('click', () => actualizarPip(montoUSD + 10));
        pipWindow.document.getElementById('btnReset').addEventListener('click', () => actualizarPip(0));

      } else {
        alert('Tu navegador no soporta la ventana flotante (Document PiP). Prueba usando Google Chrome actualizado.');
      }
    });

    // ==========================================
    // 2. TRUCO DE NOTIFICACIÓN MULTIMEDIA (Media Session)
    // ==========================================
    let notifMontoUSD = 10.00;

    function actualizarMediaSession() {
      if (currentActiveRate <= 0) return;
      const totalBs = (notifMontoUSD * currentActiveRate).toFixed(2);

      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: `${notifMontoUSD.toFixed(2)} USD`,
          artist: `Equivale a: ${totalBs} Bs.`,
          album: 'Calculadora Pago Móvil'
        });

        if ('setPositionState' in navigator.mediaSession) {
          try {
            navigator.mediaSession.setPositionState({
              duration: 100,
              playbackRate: 1,
              position: Math.min(notifMontoUSD, 100)
            });
          } catch (e) {
            console.error(e);
          }
        }
      }
    }

    btnNotif.addEventListener('click', async () => {
      if (currentActiveRate <= 0) {
        alert('Espera a que cargue la tasa antes de activar el modo notificación.');
        return;
      }

      try {
        await audioSilencioso.play();

        navigator.mediaSession.setActionHandler('nexttrack', () => {
          if (notifMontoUSD < 100) notifMontoUSD += 1;
          actualizarMediaSession();
        });

        navigator.mediaSession.setActionHandler('previoustrack', () => {
          if (notifMontoUSD > 0) notifMontoUSD -= 1;
          actualizarMediaSession();
        });

        navigator.mediaSession.setActionHandler('seekto', (details) => {
          if (details.seekTime !== undefined) {
            notifMontoUSD = details.seekTime;
            actualizarMediaSession();
          }
        });

        navigator.mediaSession.setActionHandler('play', () => {});
        navigator.mediaSession.setActionHandler('pause', () => {});

        actualizarMediaSession();
        alert('¡Modo notificación activado! Baja la barra de notificaciones de tu teléfono para ver la conversión y usar los botones de salto.');
      } catch (err) {
        console.error("Error al reproducir audio silencioso:", err);
        alert('No se pudo iniciar el modo notificación. Asegúrate de otorgar permisos de reproducción.');
      }
    });

    // Registro del Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registrado:', reg.scope))
          .catch(err => console.error('Error en SW:', err));
      });
    }
  </script>
</body>
</html>
