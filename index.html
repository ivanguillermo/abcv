<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>A-BCV</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BCV Dólar">
  <link rel="apple-touch-icon" href="mitasa.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Calcula TASA BCV</h1>
      <span id="statusBadge" class="badge">Conectando...</span>
    </header>

    <div class="tab-container">
      <button type="button" class="tab-btn active" id="tabHoyBtn">Dólar</button>
      <button type="button" class="tab-btn" id="tabEuroBtn">Euro</button>
      <button type="button" class="tab-btn" id="tabHistorialBtn">Histórico</button>
    </div>

    <main class="card">
      <div class="field-group history-selector" id="historyDateGroup" style="display: none;">
        <div class="field-header">
          <label for="historyDateInput">Seleccionar Fecha Pasada</label>
        </div>
        <input type="date" id="historyDateInput">
      </div>

      <div class="rate-box">
        <div class="label" id="rateLabel">Tasa de Hoy</div>
        <div class="value" id="rateDisplay">--.--</div>
        <div class="date-applied" id="dateAppliedDisplay">Obteniendo valor...</div>
      </div>

      <div class="field-group">
        <div class="field-header">
          <label for="usdInput" id="usdLabel">Dólares ($ USD)</label>
          <span id="usdLivePreview" class="live-preview"></span>
        </div>
        <input type="number" id="usdInput" placeholder="0.00" step="any" inputmode="decimal">
      </div>

      <div class="field-group">
        <div class="field-header">
          <label for="vesInput">Bolívares (Bs. VES)</label>
          <span id="vesLivePreview" class="live-preview"></span>
        </div>
        <input type="number" id="vesInput" placeholder="0.00" step="any" inputmode="decimal">
      </div>

      <div class="frequent-section">
        <div class="frequent-title">Copiar Monto Frecuente</div>
        <div class="frequent-grid">
          <button type="button" class="frequent-chip" onclick="copiarMontoFrecuente(1)">$1</button>
          <button type="button" class="frequent-chip" onclick="copiarMontoFrecuente(2)">$2</button>
          <button type="button" class="frequent-chip" onclick="copiarMontoFrecuente(3)">$3</button>
          <button type="button" class="frequent-chip" onclick="copiarMontoFrecuente(5)">$5</button>
          <button type="button" class="frequent-chip" onclick="copiarMontoFrecuente(10)">$10</button>
          <button type="button" class="frequent-chip" onclick="copiarMontoFrecuente(20)">$20</button>
          <button type="button" class="frequent-chip" onclick="copiarMontoFrecuente(50)">$50</button>
          <button type="button" class="frequent-chip" onclick="copiarMontoFrecuente(100)">$100</button>
        </div>
      </div>

      <div class="action-row">
        <button type="button" id="btnRefresh" class="refresh-btn">🔄 Actualizar</button>
        <button type="button" id="btnCopy" class="copy-btn">📋 Copiar</button>
      </div>

      <button type="button" id="btnNotif" class="tool-btn">Calc</button>
    </main>

    <div class="status" id="footerStatus">Conectado a Google Sheets</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
