<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Tasa BCV</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BCV Dólar">
  <link rel="apple-touch-icon" href="mitasa.png">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --input-bg: #0f172a;
      --success-color: #4ade80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .badge {
      font-size: 0.75rem;
      color: var(--accent-color);
      background-color: rgba(56, 189, 248, 0.1);
      padding: 4px 8px;
      border-radius: 12px;
      margin-top: 4px;
    }

    /* Pestañas de Navegación */
    .tab-container {
      display: flex;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #0f172a;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .rate-box {
      text-align: center;
      margin-bottom: 20px;
    }

    .rate-box .label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .rate-box .value {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--accent-color);
      margin: 4px 0;
    }

    .rate-box .date-applied {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 18px;
    }

    .field-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .field-header label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .live-preview {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--success-color);
      background-color: rgba(74, 222, 128, 0.1);
      padding: 2px 8px;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .live-preview.visible {
      opacity: 1;
    }

    input[type="number"], input[type="date"] {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 1.15rem;
      outline: none;
    }

    input[type="date"] {
      font-size: 1rem;
      color-scheme: dark;
    }

    input[type="number"]:focus, input[type="date"]:focus {
      border-color: var(--accent-color);
    }

    .refresh-btn {
      width: 100%;
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .refresh-btn:active {
      opacity: 0.8;
    }

    .status {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .history-selector {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Calculadora Dólar BCV</h1>
      <span id="statusBadge" class="badge">Conectando...</span>
    </header>

    <!-- Control de Pestañas -->
    <div class="tab-container">
      <button type="button" class="tab-btn active" id="tabHoyBtn">Tasa de Hoy</button>
      <button type="button" class="tab-btn" id="tabHistorialBtn">Consultar Histórico</button>
    </div>

    <main class="card">
      <!-- Selector de Fecha para modo Histórico -->
      <div class="field-group history-selector" id="historyDateGroup" style="display: none;">
        <div class="field-header">
          <label for="historyDateInput">Seleccionar Fecha Pasada</label>
        </div>
        <input type="date" id="historyDateInput">
      </div>

      <div class="rate-box">
        <div class="label" id="rateLabel">Tasa de Hoy</div>
        <div class="value" id="rateDisplay">--.--</div>
        <div class="date-applied" id="dateAppliedDisplay">Obteniendo valor...</div>
      </div>

      <!-- Conversión USD -> VES -->
      <div class="field-group">
        <div class="field-header">
          <label for="usdInput">Dólares ($ USD)</label>
          <span id="usdLivePreview" class="live-preview"></span>
        </div>
        <input type="number" id="usdInput" placeholder="0.00" step="any" inputmode="decimal">
      </div>

      <!-- Conversión VES -> USD -->
      <div class="field-group">
        <div class="field-header">
          <label for="vesInput">Bolívares (Bs. VES)</label>
          <span id="vesLivePreview" class="live-preview"></span>
        </div>
        <input type="number" id="vesInput" placeholder="0.00" step="any" inputmode="decimal">
      </div>

      <button type="button" id="btnRefresh" class="refresh-btn">🔄 Actualizar Tasa</button>
    </main>

    <div class="status" id="footerStatus">Conectado a Google Sheets</div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxJ2vL3IjjUOp6sNzI_SXSpaGxOoLMcKmAWQ3nVUOfM44qR_d8-7WTg7en3K7qYKun7/exec";

    let currentActiveRate = 0;
    let todayRate = 0;
    let todayDateStr = "";
    let historicoData = [];
    let currentMode = "today"; // "today" o "history"

    const usdInput = document.getElementById('usdInput');
    const vesInput = document.getElementById('vesInput');
    const usdLivePreview = document.getElementById('usdLivePreview');
    const vesLivePreview = document.getElementById('vesLivePreview');
    const rateDisplay = document.getElementById('rateDisplay');
    const rateLabel = document.getElementById('rateLabel');
    const dateAppliedDisplay = document.getElementById('dateAppliedDisplay');
    const statusBadge = document.getElementById('statusBadge');
    const btnRefresh = document.getElementById('btnRefresh');

    const tabHoyBtn = document.getElementById('tabHoyBtn');
    const tabHistorialBtn = document.getElementById('tabHistorialBtn');
    const historyDateGroup = document.getElementById('historyDateGroup');
    const historyDateInput = document.getElementById('historyDateInput');

    document.addEventListener('DOMContentLoaded', () => {
      // Intentar cargar caché local
      const cachedData = localStorage.getItem('bcv_full_payload');
      if (cachedData) {
        try {
          const parsed = JSON.parse(cachedData);
          procesarRespuestaServidor(parsed);
          statusBadge.textContent = "Caché Local";
        } catch(e) {
          console.error("Error parseando caché local", e);
        }
      }

      obtenerTasaD1();
    });

    async function obtenerTasaD1() {
      statusBadge.textContent = "Cargando...";
      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        if (data) {
          localStorage.setItem('bcv_full_payload', JSON.stringify(data));
          procesarRespuestaServidor(data);
          statusBadge.textContent = "Conectado";
        }
      } catch (error) {
        console.error("Error obteniendo datos:", error);
        statusBadge.textContent = "Sin conexión";
        if (currentActiveRate > 0) {
          dateAppliedDisplay.textContent = "Usando datos guardados";
        }
      }
    }

    function procesarRespuestaServidor(data) {
      // 1. Tasa del día
      const valorTasa = data.tasa_d1 || data.tasa;
      if (valorTasa !== undefined && valorTasa !== null) {
        let rawValue = valorTasa.toString().replace(',', '.');
        todayRate = parseFloat(rawValue);
      }
      
      todayDateStr = data.actualizado ? data.actualizado.substring(0, 10) : 'Hoy';

      // 2. Histórico de registros
      historicoData = Array.isArray(data.datos) ? data.datos : [];

      // 3. Renderizar según el modo seleccionado
      if (currentMode === "today") {
        mostrarTasaHoy();
      } else {
        buscarTasaPorFecha();
      }
    }

    function mostrarTasaHoy() {
      currentActiveRate = todayRate;
      rateLabel.textContent = "Tasa Celda D1 (Hoy)";
      if (currentActiveRate > 0) {
        rateDisplay.textContent = `${currentActiveRate.toFixed(2)} Bs.`;
        dateAppliedDisplay.textContent = `Actualizado: ${todayDateStr}`;
      } else {
        rateDisplay.textContent = "--.--";
        dateAppliedDisplay.textContent = "Sin datos de la tasa de hoy";
      }
      recalcularLive('usd');
    }

    function buscarTasaPorFecha() {
      const fechaSeleccionada = historyDateInput.value;
      if (!fechaSeleccionada) {
        rateDisplay.textContent = "--.--";
        dateAppliedDisplay.textContent = "Selecciona una fecha válida";
        currentActiveRate = 0;
        recalcularLive('usd');
        return;
      }

      // Buscar la fecha seleccionada en el arreglo
      const registroEncontrado = historicoData.find(item => {
        if (!item.fecha) return false;
        const fechaItem = item.fecha.substring(0, 10);
        return fechaItem === fechaSeleccionada;
      });

      if (registroEncontrado) {
        currentActiveRate = parseFloat(registroEncontrado.tasa);
        rateLabel.textContent = `Tasa del ${fechaSeleccionada}`;
        rateDisplay.textContent = `${currentActiveRate.toFixed(2)} Bs.`;
        dateAppliedDisplay.textContent = `Registro encontrado en histórico`;
      } else {
        currentActiveRate = 0;
        rateLabel.textContent = `Sin registro`;
        rateDisplay.textContent = "--.--";
        dateAppliedDisplay.textContent = `No hay tasa guardada para el ${fechaSeleccionada}`;
      }
      
      recalcularLive('usd');
    }

    // Navegación de Pestañas
    tabHoyBtn.addEventListener('click', () => {
      currentMode = "today";
      tabHoyBtn.classList.add('active');
      tabHistorialBtn.classList.remove('active');
      historyDateGroup.style.display = "none";
      mostrarTasaHoy();
    });

    tabHistorialBtn.addEventListener('click', () => {
      currentMode = "history";
      tabHistorialBtn.classList.add('active');
      tabHoyBtn.classList.remove('active');
      historyDateGroup.style.display = "flex";

      // Si el input no tiene fecha seleccionada, poner la de hoy por defecto
      if (!historyDateInput.value) {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        historyDateInput.value = `${year}-${month}-${day}`;
      }

      buscarTasaPorFecha();
    });

    historyDateInput.addEventListener('change', buscarTasaPorFecha);

    function recalcularLive(origen) {
      if (currentActiveRate <= 0) {
        usdLivePreview.classList.remove('visible');
        vesLivePreview.classList.remove('visible');
        return;
      }

      if (origen === 'usd') {
        const valUSD = parseFloat(usdInput.value);
        if (!isNaN(valUSD) && valUSD > 0) {
          const resultadoBs = valUSD * currentActiveRate;
          vesInput.value = resultadoBs.toFixed(2);
          
          usdLivePreview.textContent = `= ${resultadoBs.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} Bs.`;
          usdLivePreview.classList.add('visible');
          vesLivePreview.classList.remove('visible');
        } else {
          vesInput.value = '';
          usdLivePreview.classList.remove('visible');
        }
      } else if (origen === 'ves') {
        const valVES = parseFloat(vesInput.value);
        if (!isNaN(valVES) && valVES > 0) {
          const resultadoUSD = valVES / currentActiveRate;
          usdInput.value = resultadoUSD.toFixed(2);
          
          vesLivePreview.textContent = `= $${resultadoUSD.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
          vesLivePreview.classList.add('visible');
          usdLivePreview.classList.remove('visible');
        } else {
          usdInput.value = '';
          vesLivePreview.classList.remove('visible');
        }
      }
    }

    usdInput.addEventListener('input', () => recalcularLive('usd'));
    vesInput.addEventListener('input', () => recalcularLive('ves'));
    btnRefresh.addEventListener('click', obtenerTasaD1);

    // Registro del Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registrado:', reg.scope))
          .catch(err => console.error('Error en SW:', err));
      });
    }
  </script>
</body>
</html>
