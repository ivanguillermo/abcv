<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Flotante</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; background: #121212; color: #fff; }
    button { padding: 10px 15px; font-size: 16px; border-radius: 8px; border: none; background: #007bff; color: white; cursor: pointer; }
  </style>
</head>
<body>

  <h2>Calculadora de Divisas PWA</h2>
  <p>Presiona el botón para abrir la ventana flotante sobre cualquier app:</p>
  
  <button id="btnPip">Abrir Calculadora Flotante 🚀</button>

  <script>
    const tasaBCV = 36.50; // Sustituir por la tasa real o dinámica de tu PWA
    let montoUSD = 10;

    document.getElementById('btnPip').addEventListener('click', async () => {
      // Verificar si el navegador soporta Document Picture-in-Picture
      if ('documentPictureInPicture' in window) {
        
        // Abrir la ventana flotante pequeña
        const pipWindow = await documentPictureInPicture.requestWindow({
          width: 280,
          height: 220,
        });

        // Copiar los estilos a la ventana flotante
        const style = document.createElement('style');
        style.textContent = `
          body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            user-select: none;
          }
          .monto-box {
            background: #2a2a2a;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
          }
          .monto-usd { font-size: 14px; color: #aaa; margin: 0; }
          .monto-bs { font-size: 20px; font-weight: bold; color: #4caf50; margin: 2px 0 0 0; }
          input[type=range] { width: 100%; margin: 6px 0; accent-color: #4caf50; }
          .btn-group { display: flex; gap: 4px; justify-content: space-between; }
          .btn-step {
            flex: 1;
            padding: 6px 0;
            background: #333;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
          }
          .btn-step:active { background: #555; }
        `;
        pipWindow.document.head.appendChild(style);

        // Estructura HTML interna de la ventana flotante
        pipWindow.document.body.innerHTML = `
          <div class="monto-box">
            <p class="monto-usd">USD: <span id="pipUsd">10.00</span> $</p>
            <p class="monto-bs"><span id="pipBs">365.00</span> Bs</p>
          </div>

          <input type="range" id="pipSlider" min="0" max="100" step="0.5" value="10">

          <div class="btn-group">
            <button class="btn-step" id="btnAdd05">+0.5</button>
            <button class="btn-step" id="btnAdd1">+1</button>
            <button class="btn-step" id="btnAdd5">+5</button>
            <button class="btn-step" id="btnAdd10">+10</button>
            <button class="btn-step" id="btnReset" style="background:#a33;">C</button>
          </div>
        `;

        // Referencias a elementos dentro de la ventana PiP
        const txtUsd = pipWindow.document.getElementById('pipUsd');
        const txtBs = pipWindow.document.getElementById('pipBs');
        const slider = pipWindow.document.getElementById('pipSlider');

        // Función para refrescar cálculos
        function actualizar(val) {
          montoUSD = Math.max(0, parseFloat(val));
          slider.value = montoUSD;
          txtUsd.innerText = montoUSD.toFixed(2);
          txtBs.innerText = (montoUSD * tasaBCV).toFixed(2);
        }

        // Eventos
        slider.addEventListener('input', (e) => actualizar(e.target.value));
        pipWindow.document.getElementById('btnAdd05').addEventListener('click', () => actualizar(montoUSD + 0.5));
        pipWindow.document.getElementById('btnAdd1').addEventListener('click', () => actualizar(montoUSD + 1));
        pipWindow.document.getElementById('btnAdd5').addEventListener('click', () => actualizar(montoUSD + 5));
        pipWindow.document.getElementById('btnAdd10').addEventListener('click', () => actualizar(montoUSD + 10));
        pipWindow.document.getElementById('btnReset').addEventListener('click', () => actualizar(0));

      } else {
        alert('Tu navegador actual no soporta la Document Picture-in-Picture API. Prueba en Chrome / Edge actualizado.');
      }
    });

const audioSilencioso = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=');
audioSilencioso.loop = true;

let montoUSD = 10.00;
const tasaBCV = 36.50; // Tu tasa actual

function actualizarMediaSession() {
  const totalBs = (montoUSD * tasaBCV).toFixed(2);

  if ('mediaSession' in navigator) {
    // 1. Actualizamos los textos (Título y Artista)
    navigator.mediaSession.metadata = new MediaMetadata({
      title: `${montoUSD.toFixed(2)} USD`,
      artist: `Equivale a: ${totalBs} Bs`,
      album: 'Calculadora Pago Móvil'
    });

    // 2. Hackeamos la barra de progreso (Seekbar)
    // Hacemos de cuenta que la duración total de la "canción" son 100 dólares
    if ('setPositionState' in navigator.mediaSession) {
      try {
        navigator.mediaSession.setPositionState({
          duration: 100,  // El tope máximo de tu slider (100 dólares)
          playbackRate: 1,
          position: montoUSD // La posición actual equivale al monto en dólares
        });
      } catch (error) {
        console.error(error);
      }
    }
  }
}

async function activarCalculadoraNotificacion() {
  await audioSilencioso.play();

  // Botón Siguiente (+1$)
  navigator.mediaSession.setActionHandler('nexttrack', () => {
    if (montoUSD < 100) montoUSD += 1;
    actualizarMediaSession();
  });

  // Botón Anterior (-1$)
  navigator.mediaSession.setActionHandler('previoustrack', () => {
    if (montoUSD > 0) montoUSD -= 1;
    actualizarMediaSession();
  });

  // El truco extra: Si el usuario arrastra la barrita de progreso de la notificación
  navigator.mediaSession.setActionHandler('seekto', (details) => {
    if (details.seekTime !== undefined) {
      montoUSD = details.seekTime; // El punto donde soltó la barra se convierte en los dólares
      actualizarMediaSession();
    }
  });

  actualizarMediaSession();
  alert('¡Listo! Baja la barra de notificaciones y prueba deslizar la línea de tiempo o tocar los botones.');
}
  </script>
</body>
</html>
